# Không đặt tên "devforge" — tránh trùng volume/container project khác.
name: devforge-be

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Refresh sessions only. Losing this volume signs everyone out; it never
  # holds anything that is not also derivable from a fresh login.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every mail the app sends and shows it at http://localhost:8025
  # instead of delivering it. Real inboxes stay out of development, and no
  # Gmail app password is needed to see what a signup code actually looks like.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025" # SMTP — point SMTP_HOST/SMTP_PORT here
      - "127.0.0.1:8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API never sees /var/run/docker.sock. It talks to this, which forwards
  # only the endpoints below — a container escape that reaches the API still
  # cannot read images, touch volumes, or ask the daemon about the host.
  # CONTAINERS covers create/inspect/remove, POST covers create/start, EXEC
  # covers the terminal and the check scripts.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      # Everything else is denied by the image's own default of 0. Spelled out
      # here because a blank line reads as "not considered" a year from now.
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      INFO: 0
      SYSTEM: 0
      AUTH: 0
      SECRETS: 0
      SWARM: 0
    ports:
      - "127.0.0.1:2375:2375" # DOCKER_HOST for the API
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  pgdata:
