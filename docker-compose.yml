# Không đặt tên "devforge" — tránh trùng volume/container project khác.
name: devforge-be

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Refresh sessions only. Losing this volume signs everyone out; it never
  # holds anything that is not also derivable from a fresh login.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every mail the app sends and shows it at http://localhost:8025
  # instead of delivering it. Real inboxes stay out of development, and no
  # Gmail app password is needed to see what a signup code actually looks like.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025" # SMTP — point SMTP_HOST/SMTP_PORT here
      - "127.0.0.1:8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
