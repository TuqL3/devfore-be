# Không đặt tên "devforge" — tránh trùng volume/container project khác.
name: devforge-be

# Polyrepo: compose này chỉ dựng backend stack (postgres + api).
# FE chạy standalone ở repo devforge-fe: `npm run dev` → vite :5173, trỏ VITE_API_URL về :8080.
# Caddy edge (deploy/caddy) chỉ dùng ở prod (P9).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: dev
    environment:
      APP_ENV: development
      PORT: "8080"
      LOG_LEVEL: debug
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # FE standalone chạy ở :5173 (vite host).
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  gomod:
