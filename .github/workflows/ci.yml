name: CI

on:
  push:
    # The default branch is master. Watching main meant every merge landed
    # without CI ever running; only the pull_request trigger was doing any work.
    branches: [master]
  pull_request:

jobs:
  be:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  secrets:
    runs-on: ubuntu-latest
    # gitleaks lists the commits on the pull request to decide what to scan, and
    # the default token cannot read them: the API answers 403 and the job dies
    # before it looks at a single line.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
