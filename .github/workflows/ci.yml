name: CI

on:
  push:
    # The default branch is master. Watching main meant every merge landed
    # without CI ever running; only the pull_request trigger was doing any work.
    branches: [master]
    # Production releases are cut by tag, not by merge: master stays green and
    # deployable, but nothing reaches the box until someone names a version.
    tags: ["v*"]
  pull_request:

env:
  # Lowercased at use: GHCR rejects an uppercase path, and the account here is
  # `TuqL3`. The package name is devforge-*, not devfore-*, because it is a name
  # this project chose rather than one inherited from a typo in a repo slug.
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/devforge-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/devforge-web
  LAB_PREFIX: ghcr.io/${{ github.repository_owner }}/devforge-lab

jobs:
  be:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - run: gofmt -l . | (! grep .)
      # golangci-lint REPLACES `go vet`: govet is one of the linters it runs by
      # default, so keeping both means running vet twice and reading it once.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - run: go build ./...
      - name: test with coverage
        run: |
          go test -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1
          # A ratchet, not a target. The floor is the number the tree had when
          # this step was added (16.8%), rounded down so an unrelated refactor
          # cannot turn CI red on a rounding wobble. Raise it whenever real
          # coverage rises; never lower it to make a build pass.
          pct=$(go tool cover -func=cover.out | awk 'END{gsub(/%/,"",$3); print $3}')
          awk -v p="$pct" -v f=16.5 'BEGIN {
            if (p + 0 < f + 0) {
              printf "coverage %.1f%% is below the floor of %.1f%% — add tests, do not lower the floor\n", p, f
              exit 1
            }
            printf "coverage %.1f%% (floor %.1f%%)\n", p, f
          }'

  secrets:
    runs-on: ubuntu-latest
    # gitleaks lists the commits on the pull request to decide what to scan, and
    # the default token cannot read them: the API answers 403 and the job dies
    # before it looks at a single line.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Dependencies, not base images: a vulnerable module in go.sum is both more
      # common and more directly ours than anything in a distroless layer.
      #
      # --ignore-unfixed is not optional. Without it CI goes red over CVEs that
      # have no patch to apply, and three weeks later somebody deletes the job.
      - name: trivy fs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      # The edge is the only container on the box with a published port, and it
      # is the only image in the stack that nothing here ever looks at: it is
      # pulled on the box, not built. That gap is not theoretical — the pin
      # started life as nginx:1.27-alpine, which carries 39 fixable HIGH CVEs,
      # and nothing in this pipeline would ever have said so.
      #
      # The tag is read out of the compose file rather than written here twice,
      # so this cannot drift into scanning a version production does not run.
      - id: edge
        run: |
          set -euo pipefail
          tag=$(grep -oE 'nginx:[0-9.]+-alpine' docker-compose.prod.yml | head -1)
          [ -n "$tag" ] || { echo "no pinned nginx image found in docker-compose.prod.yml" >&2; exit 1; }
          echo "scanning the edge image production runs: $tag"
          echo "image=$tag" >> "$GITHUB_OUTPUT"
      - name: trivy edge image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.edge.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  # Build once, here, and never on the box. Runs on master only: a tag does not
  # build anything, it promotes what master already produced (job `promote`).
  images:
    if: github.ref == 'refs/heads/master'
    needs: [be, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: lowercase image names
        run: |
          {
            echo "API_IMAGE=${API_IMAGE,,}"
            echo "LAB_PREFIX=${LAB_PREFIX,,}"
            echo "SHA_TAG=sha-$(git rev-parse --short HEAD)"
          } >> "$GITHUB_ENV"

      # --load, not --push: the image has to exist locally for Trivy to read it,
      # and the whole point is that nothing reaches the registry until it has
      # been scanned. A scan after the push is a report, not a gate.
      - name: build api
        run: docker build --target prod --load -t "$API_IMAGE:$SHA_TAG" .
      - name: trivy api
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}:${{ env.SHA_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      # The lab images are the real attack surface and the reason Trivy is here
      # at all. devforge-api is distroless: no shell, no package manager. These
      # four carry a shell and coreutils on purpose — labs/linux/Dockerfile says
      # so outright — and they are what a stranger types into.
      #
      # They are pushed rather than built on the box so the bits that were
      # scanned are the bits a student gets. up.sh retags them locally to the
      # `devforge/<name>:latest` the lab_images rows already hold, which is why
      # this costs no migration.
      - name: build lab images
        run: |
          for img in linux git docker net; do
            docker build -f "labs/$img/Dockerfile" --load -t "$LAB_PREFIX-$img:$SHA_TAG" labs
          done
      - name: trivy lab images
        run: |
          for img in linux git docker net; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore:/.trivyignore" \
              aquasec/trivy:0.58.1 image --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --ignorefile /.trivyignore "$LAB_PREFIX-$img:$SHA_TAG"
          done

      - name: push
        run: |
          set -euo pipefail
          images=("$API_IMAGE")
          for img in linux git docker net; do images+=("$LAB_PREFIX-$img"); done

          for repo in "${images[@]}"; do
            docker push "$repo:$SHA_TAG"
            # A moving :master tag as well, and it exists for exactly one
            # reason: deploy/up.sh deploys the whole stack under ONE
            # IMAGE_TAG, and this repo's short sha is not devforge-fe's.
            # devforge-web:sha-<a be sha> does not exist and never will, so a
            # sha can name this repo's images but cannot name a stack.
            # :master is the one name both repos put on their newest master
            # build, so it can.
            #
            # Production does not use it. Production deploys :vX.Y.Z, which
            # `promote` copies from the exact sha that Trivy passed. A moving
            # tag is right for a box that tracks a branch and wrong for one
            # that ships a release — and it is why .image-tag on staging says
            # `master` rather than something you can roll back to.
            docker tag "$repo:$SHA_TAG" "$repo:master"
            docker push "$repo:master"
          done

  # Every green master push lands on staging, by the moving :master tag that the
  # push step above also writes. The bits are the same ones :sha-<short> names
  # and that a tag later renames to :v1.2.0, so staging stays a rehearsal rather
  # than a lookalike — QA and production run identical images.
  #
  # Not :sha-<short>, even though that is the more precise name. up.sh deploys
  # the whole stack under one IMAGE_TAG and devforge-web is built in the other
  # repo under its own sha, so a sha tag names five of the six images and
  # nothing for the sixth.
  #
  # Staging is its own VPS, not a second stack beside production. On one box the
  # two share a Docker daemon while keeping separate databases, and
  # MAX_CONTAINERS counts lab seats from the database it can see
  # (internal/labs/adapter/repo/session.go) — so each half believes it has room
  # and together they spawn twice the containers the machine was sized for.
  # A second box has no such coupling, and no way for a QA session to take CPU
  # from a class in progress.
  deploy-staging:
    if: github.ref == 'refs/heads/master'
    needs: [images]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Until the box exists this job would fail on every merge, and a workflow
      # that is always red teaches people to ignore it. Skip quietly instead:
      # the secret appearing is what turns staging on.
      - id: gate
        run: |
          if [ -z "${{ secrets.STAGING_SSH_HOST }}" ]; then
            echo "no STAGING_SSH_HOST — staging box not provisioned yet (INFRA.md §13.4), skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: ssh and release
        if: steps.gate.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          # A constant, and still checked before it is interpolated into a
          # remote shell command — the check is about the habit, not about
          # this value. Staging tracks master, so the tag it deploys is the
          # moving one both repos publish.
          TAG=master
          install -d -m 700 ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # Staging tracks the branch, production tracks a tag — that is the only
          # difference between the two deploys. Force-checkout rather than pull
          # for the same reason as production: a pull refuses to run wherever a
          # previous checkout left a detached HEAD.
          timeout 1800 ssh -o ConnectTimeout=10 -o BatchMode=yes \
            -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "set -e
             cd /opt/devforge/devforge-be
             git fetch --force origin master
             git checkout --force -B master origin/master
             IMAGE_TAG=$TAG ./deploy/up.sh"

  # A tag builds nothing. It renames images that already exist, which is what
  # makes "the thing that was tested" and "the thing that is deployed" the same
  # bits rather than two builds of one commit.
  promote:
    if: github.ref_type == 'tag'
    needs: [be, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: retag sha to version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A tag on a commit that never reached master was never built, never
          # scanned and never seen on staging. Refuse it here rather than
          # discovering the missing image halfway through a deploy.
          git fetch --depth=1 origin master
          git merge-base --is-ancestor HEAD origin/master \
            || { echo "tag $TAG is not on master"; exit 1; }

          api=${API_IMAGE,,}
          labs=${LAB_PREFIX,,}
          sha_tag="sha-$(git rev-parse --short HEAD)"

          # imagetools copies by digest, server side: no pull, no rebuild, and
          # the promoted image is bit-identical to the scanned one by
          # construction rather than by convention.
          for src in "$api:$sha_tag" "$labs-linux:$sha_tag" "$labs-git:$sha_tag" \
                     "$labs-docker:$sha_tag" "$labs-net:$sha_tag"; do
            docker buildx imagetools inspect "$src" >/dev/null \
              || { echo "no image $src — the tagged commit was never built on master"; exit 1; }
            docker buildx imagetools create -t "${src%:*}:$TAG" "$src"
          done

  # Deploy runs only on a version tag, after lint/test/gitleaks are green on
  # that exact tag and after both repos have promoted their images. The step is
  # an ssh and nothing else: no registry work, no artifacts. The env file lives
  # on the server at chmod 600 and is not shipped from here.
  deploy:
    if: github.ref_type == 'tag'
    needs: [promote]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: wait for the frontend image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          web=${WEB_IMAGE,,}
          # This is the cross-repo gate. A release is one version number worn by
          # both repos, and `needs:` cannot span repositories — but the registry
          # can: devforge-fe promotes its own image under the same tag, and if
          # that has not happened this deploy has no frontend to ship and stops
          # before touching the box.
          #
          # A wait rather than a straight check because the two repos are tagged
          # seconds apart and their workflows do not start in a fixed order.
          for i in $(seq 1 30); do
            if docker manifest inspect "$web:$TAG" >/dev/null 2>&1; then
              echo "found $web:$TAG"; exit 0
            fi
            echo "waiting for $web:$TAG ($i/30)"; sleep 10
          done
          echo "devforge-fe never published $TAG — a release tags BOTH repos with the same name" >&2
          exit 1

      # Same reasoning as deploy-staging: before the box exists this step fails
      # on every release tag, and the first thing a permanently-red job teaches
      # is to stop reading it. The secret appearing is what turns production on.
      #
      # It sits AFTER the image gate on purpose. That gate is about the release
      # being complete — both repos published the tag — and it is worth failing
      # loudly even with nowhere to deploy to, because a half-tagged release is
      # wrong whether or not there is a box.
      - id: gate
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "no SSH_HOST — production box not provisioned yet (INFRA.md §13.4), skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ssh and release
        if: steps.gate.outputs.skip != 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The tag name is interpolated into a remote shell command, so it is
          # checked before it gets there. The `v*` filter above is not a filter
          # on shell metacharacters.
          case "$TAG" in
            v[0-9]*) [ -z "${TAG//[A-Za-z0-9._-]/}" ] || { echo "refusing tag: $TAG"; exit 1; } ;;
            *) echo "refusing tag: $TAG"; exit 1 ;;
          esac
          install -d -m 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          # Only the be clone is checked out now, and only for the things that
          # are not in an image: migrations, the nginx config, the compose files and
          # up.sh itself. devforge-fe is not cloned on the box at all any more —
          # it is a pulled image — which is also what retired the two-repo
          # checkout and the detached-HEAD trap that came with it.
          #
          # Force-checkout, never `git pull --ff-only`: a pull refuses to run on
          # the detached HEAD a tag checkout leaves behind.
          #
          # timeout, ConnectTimeout and BatchMode together: a wedged box would
          # otherwise hold a runner for the full six-hour job limit, and a
          # prompt for a passphrase or a host key would hang rather than fail.
          timeout 1800 ssh -o ConnectTimeout=10 -o BatchMode=yes \
            -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e
             cd /opt/devforge/devforge-be
             git fetch --tags --force
             git checkout --force --detach $TAG
             IMAGE_TAG=$TAG ./deploy/up.sh"
