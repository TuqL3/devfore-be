name: CI

on:
  push:
    # develop integrates, master is production. Both are watched, and the
    # difference between them is not in this block — it is the `if:` guard on
    # the jobs that build. Every job without a guard runs on both; images and
    # deploy-staging are master-only. A push to develop therefore checks the
    # code and builds nothing.
    #
    # Watching `main` meant every merge landed without CI ever running, and
    # only the pull_request trigger was doing any work. Neither branch is main.
    branches: [master, develop]
    # Production releases are cut by tag, not by merge: master stays green and
    # deployable, but nothing reaches the box until someone names a version.
    tags: ["v*"]
  pull_request:

env:
  # Lowercased at use: GHCR rejects an uppercase path, and the account here is
  # `TuqL3`. The package name is devforge-*, not devfore-*, because it is a name
  # this project chose rather than one inherited from a typo in a repo slug.
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/devforge-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/devforge-web
  LAB_PREFIX: ghcr.io/${{ github.repository_owner }}/devforge-lab

jobs:
  be:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Must not be older than the `go` directive in go.mod. When it is,
          # Go downloads the newer toolchain to satisfy the directive but the
          # `go` driver stays at the pinned one, and every stdlib package
          # fails to compile with
          #   compile: version "go1.26.0" does not match go tool version "go1.25.14"
          # which reads like a broken dependency and is not one.
          go-version: "1.26"
          cache-dependency-path: go.sum
      - run: gofmt -l . | (! grep .)
      # golangci-lint REPLACES `go vet`: govet is one of the linters it runs by
      # default, so keeping both means running vet twice and reading it once.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - run: go build ./...
      - name: test with coverage
        run: |
          go test -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1
          # A ratchet, not a target. The floor is the number the tree had when
          # this step was added (16.8%), rounded down so an unrelated refactor
          # cannot turn CI red on a rounding wobble. Raise it whenever real
          # coverage rises; never lower it to make a build pass.
          pct=$(go tool cover -func=cover.out | awk 'END{gsub(/%/,"",$3); print $3}')
          awk -v p="$pct" -v f=16.5 'BEGIN {
            if (p + 0 < f + 0) {
              printf "coverage %.1f%% is below the floor of %.1f%% — add tests, do not lower the floor\n", p, f
              exit 1
            }
            printf "coverage %.1f%% (floor %.1f%%)\n", p, f
          }'

      # Handed to the `sonar` job, which runs on its own machine and would
      # otherwise have to re-run the whole suite to produce the same file.
      # Uploading it also means Sonar reports the exact number the floor above
      # gates on, rather than a second measurement that can drift from it.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cover.out
          retention-days: 1

  # Code quality, and the third gate next to golangci-lint and Trivy. It is the
  # only one of the three that looks at the shape of the code rather than at a
  # rule list or a CVE feed.
  #
  # Self-skips without SONAR_TOKEN, the same way deploy and deploy-staging skip
  # without their SSH secrets: the project does not exist on SonarQube Cloud
  # yet, and a job that is red on every branch until someone signs up teaches
  # people to stop reading CI.
  sonar:
    needs: [be]
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "no SONAR_TOKEN — SonarQube Cloud project not set up yet (INFRA.md §13.4), skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          # Sonar reads git history to decide what is new code, and the whole
          # point of the gate is that it judges the diff rather than the
          # accumulated past. A shallow clone makes every line look new.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.skip != 'true'
        with:
          name: coverage
      # No SONAR_HOST_URL: that variable is for a self-hosted server, and
      # setting it points the scanner away from Cloud. Everything else the
      # scanner needs is in sonar-project.properties, including
      # sonar.qualitygate.wait, which is what fails this job on a red gate.
      - uses: SonarSource/sonarqube-scan-action@v8.2.2
        if: steps.gate.outputs.skip != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  secrets:
    runs-on: ubuntu-latest
    # gitleaks lists the commits on the pull request to decide what to scan, and
    # the default token cannot read them: the API answers 403 and the job dies
    # before it looks at a single line.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Dependencies, not base images: a vulnerable module in go.sum is both more
      # common and more directly ours than anything in a distroless layer.
      #
      # --ignore-unfixed is not optional. Without it CI goes red over CVEs that
      # have no patch to apply, and three weeks later somebody deletes the job.
      - name: trivy fs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      # The edge is the only container on the box with a published port, and it
      # is the only image in the stack that nothing here ever looks at: it is
      # pulled on the box, not built. That gap is not theoretical — the pin
      # started life as nginx:1.27-alpine, which carries 39 fixable HIGH CVEs,
      # and nothing in this pipeline would ever have said so.
      #
      # The tag is read out of the compose file rather than written here twice,
      # so this cannot drift into scanning a version production does not run.
      - id: edge
        run: |
          set -euo pipefail
          tag=$(grep -oE 'nginx:[0-9.]+-alpine' docker-compose.prod.yml | head -1)
          [ -n "$tag" ] || { echo "no pinned nginx image found in docker-compose.prod.yml" >&2; exit 1; }
          echo "scanning the edge image production runs: $tag"
          echo "image=$tag" >> "$GITHUB_OUTPUT"
      - name: trivy edge image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.edge.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  # A tag is the only thing that builds. Pushes to develop and to master are
  # checked and nothing else: no image, no registry write, nothing reaching a
  # box. The version number therefore exists before the bits do, which is why
  # the images are named after it directly and there is no sha tag to promote.
  #
  # The cost of building here rather than earlier is that the base images are
  # pinned to a minor line (golang:1.26-alpine), so a release build can pull
  # patch layers that nothing has run before. Trivy still gates the push, so
  # that surfaces as a failed release rather than as a shipped one.
  images:
    if: github.ref_type == 'tag'
    needs: [be, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both refusals below used to live in the `promote` job. That job is gone
      # — there is no pre-built image left to promote — but the two rules it
      # enforced are not, so they moved here, in front of the build rather than
      # after it.
      - name: check the tag, then name the images after it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Checked here, in front of a ten-minute build, not after it.
          # scripts/release-guard.check.sh is what holds this rule honest.
          ./scripts/release-guard.sh "$TAG"
          # A tag on a commit that never reached master was never reviewed and
          # never merged. Refuse to build it at all rather than publish an
          # image nobody agreed to.
          git fetch origin master
          git merge-base --is-ancestor HEAD origin/master \
            || { echo "tag $TAG is not on master"; exit 1; }
          {
            echo "API_IMAGE=${API_IMAGE,,}"
            echo "LAB_PREFIX=${LAB_PREFIX,,}"
            echo "TAG=$TAG"
          } >> "$GITHUB_ENV"

      # --load, not --push: the image has to exist locally for Trivy to read it,
      # and the whole point is that nothing reaches the registry until it has
      # been scanned. A scan after the push is a report, not a gate.
      - name: build api
        run: docker build --target prod --load -t "$API_IMAGE:$TAG" .
      - name: trivy api
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      # The lab images are the real attack surface and the reason Trivy is here
      # at all. devforge-api is distroless: no shell, no package manager. These
      # four carry a shell and coreutils on purpose — labs/linux/Dockerfile says
      # so outright — and they are what a stranger types into.
      #
      # They are pushed rather than built on the box so the bits that were
      # scanned are the bits a student gets. up.sh retags them locally to the
      # `devforge/<name>:latest` the lab_images rows already hold, which is why
      # this costs no migration.
      - name: build lab images
        run: |
          for img in linux git docker net; do
            docker build -f "labs/$img/Dockerfile" --load -t "$LAB_PREFIX-$img:$TAG" labs
          done
      - name: trivy lab images
        run: |
          for img in linux git docker net; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore:/.trivyignore" \
              aquasec/trivy:0.58.1 image --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --ignorefile /.trivyignore "$LAB_PREFIX-$img:$TAG"
          done

      - name: push
        run: |
          set -euo pipefail
          images=("$API_IMAGE")
          for img in linux git docker net; do images+=("$LAB_PREFIX-$img"); done
          # One name only. The moving :master tag that used to be written here
          # existed so a stack could be deployed under a single IMAGE_TAG while
          # this repo's short sha differed from devforge-fe's. A version tag is
          # already a name both repos share, so the moving tag has nothing left
          # to do — and unlike :master it is something you can roll back to.
          for repo in "${images[@]}"; do
            docker push "$repo:$TAG"
          done

  # Deploy runs only on a version tag, after lint/test/gitleaks are green on
  # that exact tag and after both repos have built and published it. The step is
  # an ssh and nothing else: no registry work, no artifacts. The env file lives
  # on the server at chmod 600 and is not shipped from here.
  deploy:
    if: github.ref_type == 'tag'
    needs: [images]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # Checked out for one reason: scripts/release-guard.sh. Nothing else in
      # this job reads the tree — the box fetches its own copy.
      - uses: actions/checkout@v7
      - name: wait for the frontend image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          web=${WEB_IMAGE,,}
          # This is the cross-repo gate. A release is one version number worn by
          # both repos, and `needs:` cannot span repositories — but the registry
          # can: devforge-fe builds and pushes its own image under the same tag, and
          # that has not happened this deploy has no frontend to ship and stops
          # before touching the box.
          #
          # A wait rather than a straight check because the two repos are tagged
          # seconds apart, their workflows do not start in a fixed order, and
          # each now has a full image build to get through first.
          for i in $(seq 1 30); do
            if docker manifest inspect "$web:$TAG" >/dev/null 2>&1; then
              echo "found $web:$TAG"; exit 0
            fi
            echo "waiting for $web:$TAG ($i/30)"; sleep 10
          done
          echo "devforge-fe never published $TAG — a release tags BOTH repos with the same name" >&2
          exit 1

      # Same reasoning as deploy-staging: before the box exists this step fails
      # on every release tag, and the first thing a permanently-red job teaches
      # is to stop reading it. The secret appearing is what turns production on.
      #
      # It sits AFTER the image gate on purpose. That gate is about the release
      # being complete — both repos published the tag — and it is worth failing
      # loudly even with nowhere to deploy to, because a half-tagged release is
      # wrong whether or not there is a box.
      - id: gate
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "no SSH_HOST — production box not provisioned yet (INFRA.md §13.4), skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ssh and release
        if: steps.gate.outputs.skip != 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The tag reaches a remote shell below, so it is checked before it
          # gets there. Same script the images job runs, so the two cannot
          # disagree about what a release name is allowed to look like.
          ./scripts/release-guard.sh "$TAG"
          install -d -m 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          # Only the be clone is checked out now, and only for the things that
          # are not in an image: migrations, the nginx config, the compose files and
          # up.sh itself. devforge-fe is not cloned on the box at all any more —
          # it is a pulled image — which is also what retired the two-repo
          # checkout and the detached-HEAD trap that came with it.
          #
          # Force-checkout, never `git pull --ff-only`: a pull refuses to run on
          # the detached HEAD a tag checkout leaves behind.
          #
          # timeout, ConnectTimeout and BatchMode together: a wedged box would
          # otherwise hold a runner for the full six-hour job limit, and a
          # prompt for a passphrase or a host key would hang rather than fail.
          timeout 1800 ssh -o ConnectTimeout=10 -o BatchMode=yes \
            -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e
             cd /opt/devforge/devforge-be
             git fetch --tags --force
             git checkout --force --detach $TAG
             IMAGE_TAG=$TAG ./deploy/up.sh"
