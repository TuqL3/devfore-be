# Production edge. One site, one origin, routed by path (INFRA.md §8): the SPA
# and the API share a domain, so there is no CORS and one certificate.
#
# This file is mounted into /etc/nginx/conf.d/, which the stock image includes
# from inside http{} — that is why the map and resolver directives below are
# legal here with no server{} around them.
#
# It replaces deploy/caddy/Caddyfile.prod one route for one route. The routing
# contract lives in INFRA.md §8 "Domain & routing", not in either proxy's
# syntax; if the two ever disagree, the doc is the one that is right.

# ── Docker's embedded DNS ────────────────────────────────────────────────────
# Without a resolver nginx resolves `api` ONCE at startup and caches that
# address forever. Every deploy replaces the api container with one on a new
# bridge address, so the edge keeps proxying to an address nothing answers on:
# a 502 that survives restarting the api and clears only when nginx itself is
# restarted. The resolver is consulted only for names that arrive in a
# variable, which is why every proxy_pass below goes through `set` instead of
# naming the service literally.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── WebSocket upgrade ────────────────────────────────────────────────────────
# Connection must be "upgrade" only when the client asked for one; a hardcoded
# value breaks keepalive on every ordinary request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Link-preview crawlers ────────────────────────────────────────────────────
# Facebook/X/Slack/Zalo do not run JavaScript and the app is an SPA, so a
# shared link pasted into any of them renders a blank box. Those user agents,
# and only those, get sent to an endpoint that returns HTML with the og:* tags
# already in it. Real people still get the app.
map $http_user_agent $crawler_ua {
    default 0;
    '~*(facebookexternalhit|twitterbot|slackbot|discordbot|telegrambot|linkedinbot|whatsapp|zalo|skypeuripreview|embedly|quora link preview|pinterest|redditbot|bingbot|googlebot)' 1;
}

# ── Container liveness ───────────────────────────────────────────────────────
# Bound to the container's own loopback, so it is reachable by the compose
# healthcheck and by nothing else — no port is published for it and it is not
# on the bridge. It exists because `up -d --wait` treats a crash-looping
# container as briefly running: a real 200 is the difference between "the edge
# is serving" and "the edge started again just now".
#
# Deliberately not proxied anywhere. An edge that answers only when the API is
# healthy takes the whole site down for a database blip, when what it should do
# is keep serving the SPA and let /readyz report the truth.
server {
    listen 127.0.0.1:81;
    access_log off;
    location = /nginx-alive { default_type text/plain; return 200 "ok\n"; }
    location / { return 404; }
}

# ── 80 → 443 ─────────────────────────────────────────────────────────────────
# Cloudflare talks to the origin over 443 when the SSL mode is Full (strict),
# so this server block exists for anything that reaches the box on 80 anyway.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    # One site on this box, and the hostname it answers to is whatever DNS
    # points here — the certificate below covers both <domain> and
    # staging.<domain>, so the same file serves production and staging.
    server_name _;

    # Cloudflare Origin Certificate. Trusted by Cloudflare and by nothing else,
    # which is exactly why the orange cloud is mandatory rather than optional
    # (INFRA.md §9.5): with DNS-only, a browser reaches this directly and calls
    # the certificate invalid.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Real client address ──────────────────────────────────────────────────
    # The chain is browser → Cloudflare edge → nginx → api, so without this
    # every request wears the address of a Cloudflare edge node. Two things
    # break, and both only after deploy: PUBLIC_RATE_LIMIT stops being
    # per-address and becomes 60/min for the whole internet, and audit_logs.ip
    # records the same address for every row (INFRA.md §9.5).
    #
    # Refresh the list when Cloudflare changes it:
    #   curl -s https://www.cloudflare.com/ips-v4
    #   curl -s https://www.cloudflare.com/ips-v6
    # Fetched 2026-09-18.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Avatars and cover images are capped at 2 MiB by upload.MaxImageBytes.
    # Set a little above it on purpose: at exactly the limit nginx answers its
    # own HTML 413 and the client never sees the API's JSON error, which the FE
    # is the one that knows how to display.
    client_max_body_size 4m;

    # Upstreams as variables, not literals — see the resolver note at the top.
    set $api_upstream api:8080;
    set $web_upstream web:80;

    # X-Forwarded-For is replaced, not appended to. real_ip has already turned
    # $remote_addr into the true client, so anything the caller sent under this
    # header is their own invention and passing it on is how a caller picks the
    # address that rate limiting and audit rows will believe.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Lab terminals ────────────────────────────────────────────────────────
    # A session holds one socket open for its whole life, so the read timeout
    # has to outlast LAB_SESSION_TTL rather than the default 60s. Buffering off
    # is not a tuning knob here: xterm.js is keystroke-latency bound, and a
    # buffered shell is what "the terminal is frozen" actually means.
    location /ws/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$api_upstream;
    }

    # Cover images and avatars. Easy to miss and it fails quietly: the route is
    # r.Static("/uploads", …) on the ROOT router (cmd/server/router.go), not
    # inside the /api group, and upload.Saver builds its URLs as PUBLIC_URL +
    # "/uploads/" + name. Without this block every image resolves to the SPA's
    # index.html with a 200 — a broken image, not a 404 anyone can grep for.
    location /uploads/ {
        proxy_pass http://$api_upstream;
    }

    location = /healthz {
        proxy_pass http://$api_upstream;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://$api_upstream;
        access_log off;
    }

    # ── Crawler-only rewrites ────────────────────────────────────────────────
    # These two must be matched BEFORE the catch-all, and in nginx that is not
    # a matter of writing them first: regex locations are tried in written
    # order but always beat the `location /` prefix match, which is what makes
    # this safe.
    #
    # The patterns are narrow on purpose — a share id is [A-Za-z0-9_-]+ and a
    # day is a date — because what sits behind them generates an image.
    #
    # `rewrite … last` is the only redirection directive that behaves
    # predictably inside `if`, so the crawler branch uses it and falls through
    # to the SPA for everybody else. $share_id / $day survive the rewrite
    # because named captures are ordinary variables.
    location ~ ^/r/(?<share_id>[A-Za-z0-9_-]+)/?$ {
        if ($crawler_ua) {
            rewrite ^ /api/shared-drills/$share_id/preview last;
        }
        proxy_pass http://$web_upstream;
    }

    # Quoted: nginx reads a bare { as the start of a block, so the {4} and {2}
    # repetition counts have to sit inside a string or the config will not parse.
    location ~ "^/war-room/day/(?<day>\d{4}-\d{2}-\d{2})/?$" {
        if ($crawler_ua) {
            rewrite ^ /api/daily-drill/$day/preview last;
        }
        proxy_pass http://$web_upstream;
    }

    # The SPA. devforge-web is nginx:alpine serving the built bundle on :80
    # (devforge-fe/nginx.static.conf), and it is the one that knows to answer
    # index.html for a client-side route and which files may be cached forever.
    location / {
        proxy_pass http://$web_upstream;
    }
}
