# Production overlay. Always paired with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What it adds over the base: the API and the FE actually run as containers
# (in development both run on the host under air/vite), and nginx is the only
# thing on the network with a published port.
services:
  # Pulled, never built here. Both the runner and the box are amd64, so there is
  # no QEMU tax to avoid any more (INFRA.md §9.2), and the point of pulling is
  # that the bits which ran through CI, Trivy and staging are the exact bits
  # that serve production — a rebuild on the box is a different artifact with
  # the same name.
  #
  # No `build:` key on purpose. With one present, `up` quietly builds whenever
  # the image is missing locally, which puts the box back to compiling releases
  # without anyone choosing that.
  #
  # IMAGE_TAG is required rather than defaulted: a default is how `latest` gets
  # deployed by accident, and `latest` is what makes a rollback unrepeatable.
  api:
    image: ${IMAGE_REPO:?set IMAGE_REPO in .env}/devforge-api:${IMAGE_TAG:?set IMAGE_TAG — deploy/up.sh does this}
    env_file: [.env]
    environment:
      # NOT 127.0.0.1 as in development. There the API runs on the host and
      # loopback is the proxy's published port; here loopback is the API's own
      # container and the proxy is a service name.
      LAB_DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      - uploads:/uploads
    # Nothing published. nginx reaches this over the bridge, which is also the
    # precondition for widening TRUSTED_PROXIES to 172.16.0.0/12 (§9.5).
    expose:
      - "8080"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      docker-proxy: {condition: service_started}
    healthcheck:
      # distroless has no shell and no wget; the binary probes itself.
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # No build args, and none are possible: devforge-fe's Dockerfile pins
  # VITE_API_URL to the empty string, so the bundle carries no environment and
  # every call goes out relative against whatever origin served the page. That
  # is what makes one FE image promotable from staging to production instead of
  # one build per environment, and it is why the edge below routes /api, /ws
  # and /uploads to the API on this same domain.
  web:
    image: ${IMAGE_REPO:?set IMAGE_REPO in .env}/devforge-web:${IMAGE_TAG:?set IMAGE_TAG — deploy/up.sh does this}
    expose:
      - "80"
    restart: unless-stopped

  # The edge. TLS terminates here on a Cloudflare Origin Certificate, so there
  # is no ACME client, no challenge to fail and no certificate state to keep on
  # a volume: the cert is two files that a human put on the box and that expire
  # in fifteen years (INFRA.md §9.5). That is the whole reason this is nginx and
  # not Caddy any more — Caddy's automatic HTTPS was the feature being paid for,
  # and behind an orange cloud it is the one thing that cannot be used.
  #
  # server_name is `_`, so this same file serves production and staging; which
  # box it is comes from DNS, not from the config.
  nginx:
    # 1.31, not 1.27: the versioned alpine tags are rebuilds on whatever Alpine
    # they were cut against, and 1.27-alpine carries 39 HIGH CVEs in libxml2,
    # musl, nghttp2 and zlib that 1.31-alpine does not. This container is the
    # only thing on the box with a published port, so it is the wrong one to
    # leave on a stale base. Pinned to the minor line like postgres:16-alpine,
    # not to `alpine`, which moves without anyone choosing it.
    image: nginx:1.31-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/devforge.conf:/etc/nginx/conf.d/default.conf:ro
      # Origin certificate and key. Read-only, and the directory is gitignored
      # except for its own .gitignore — a private key never reaches the repo.
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      # Loopback inside the container, not through the published port: this
      # answers whether the edge is serving, not whether the API is up. Without
      # it `up -d --wait` counts a crash-looping container as running and a
      # release that cannot serve a byte reports healthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:81/nginx-alive"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on: [api, web]
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  uploads:
