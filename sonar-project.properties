# SonarQube Cloud. Server-side settings live in the UI; what has to be in the
# repository is here, because sonar.projectKey and sonar.organization are the
# two parameters Cloud will not let you set anywhere else.
#
# ⚠️ These two are guesses until someone creates the project. SonarQube Cloud
# derives them from the bound GitHub account, and the convention is
# <owner>_<repo> and a lowercased owner — but the organization key is editable
# at signup, so check both against the UI on the first run. Getting them wrong
# fails the analysis loudly rather than silently, which is the good direction.
sonar.projectKey=TuqL3_devfore-be
sonar.organization=tuql3

# Go: sources and tests both point at the tree and are separated by inclusion,
# which is how the Go analyzer expects to be told apart — there is no separate
# test directory to name.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# tmp/ is air's build output. labs/ is four Dockerfiles and the rc files baked
# into the lab images — they are scanned by Trivy as images, which is the layer
# that matters for them. seed.sql is 128 KB of generated course content, and
# feeding it in would swamp every real finding with data.
sonar.exclusions=tmp/**,labs/**,scripts/seed.sql,cover.out

# Written by the `be` job and handed over as an artifact. The number behind it
# is the same one the 16.5% floor gates on, so the two cannot drift.
sonar.go.coverage.reportPaths=cover.out

# This is what makes the gate a gate. Without it the analysis uploads, the
# project goes red on the dashboard, and the pipeline goes green — which is a
# report, not a control.
sonar.qualitygate.wait=true
